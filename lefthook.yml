pre-commit:
  # 串行执行（不设 parallel），避免与类型检查同时运行导致低配机内存/CPU 瞬时飙升。
  # lint 仅检查暂存文件并自动修复后回填；类型检查只覆盖受影响包（见 checkType）。
  jobs:
    - name: oxlint
      glob: '*.{js,jsx,ts,tsx,vue,cjs,mjs,cts,mts}'
      run: pnpm exec oxlint --fix --type-aware --threads=4 --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: oxfmt
      glob: '*.{js,jsx,ts,tsx,vue,cjs,mjs,cts,mts,json,jsonc}'
      run: pnpm exec oxfmt --threads=4 --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: eslint
      glob: '*.{js,jsx,ts,tsx,vue,cjs,mjs,cts,mts}'
      run: pnpm exec eslint --fix {staged_files}
      stage_fixed: true
    - name: stylelint
      glob: '*.{vue,css,less,scss}'
      run: pnpm exec stylelint --fix {staged_files}
      stage_fixed: true
    # 只检查「自 HEAD 起有改动的包」及其依赖方（turbo 的 ...[HEAD] 过滤器）。
    # 全量 turbo run typecheck 会同时拉起 6 个 vue-tsc，低配机上实测被 OOM Kill（36 分钟未完成）；
    # 提交通常只碰一两个包，增量检查足以拦住类型错误，全量检查交给 CI 的 check:type。
    - name: checkType
      run: pnpm check:type:changed

post-merge:
  commands:
    install:
      run: pnpm install

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit $1
