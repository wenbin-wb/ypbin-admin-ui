name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: 校验与构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
          run_install: false

      - name: 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: Typecheck（web-antd）
        run: pnpm -F @vben/web-antd run typecheck

      - name: 单元测试（埋点 SDK）
        # 该 SDK 有真实逻辑（批量、队列、URL 截断、令牌携带）且已有单测，
        # 但包内原本没有任何 scripts，`pnpm -F @vben/tracking test` 是空转（无输出却成功）；
        # 这里显式接入，避免「命令成功但其实没跑」的假绿。
        run: pnpm -F @vben/tracking test

      - name: 构建（web-antd）
        run: pnpm -F @vben/web-antd run build

  tracking-events-drift:
    name: 校验埋点事件码未漂移
    runs-on: ubuntu-latest
    steps:
      # 前端事件码是生成的：事实源在 starter 仓库，故一并检出比对（与站点校验配置元数据同理）
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 检出 starter（事件目录事实源）
        uses: actions/checkout@v4
        with:
          repository: wenbin-wb/ypbin-starter
          path: ypbin-starter

      - name: 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0

      - name: 校验前端事件码与 starter 事件目录一致
        env:
          STARTER_REPO_ROOT: ${{ github.workspace }}/ypbin-starter
        run: node scripts/sync-tracking-events.mjs --check
