name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: 校验与构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
          run_install: false

      - name: 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 🔴 Lint —— 此前本仓 CI **完全没有 lint**（与 fork `ypbin-iot-ui` 相反：那边有四项、
      # 这边一项都没有）。结果就是 stylelint/oxfmt 的问题长期没人看见。
      # 参数与 lefthook 的 pre-commit 保持同一套：`--type-aware --threads=4`。
      - name: Lint（oxlint，类型感知）
        run: pnpm exec oxlint -c oxlint.config.ts --type-aware --threads=4 apps/web-antd/src

      # stylelint：全量覆盖 apps/web-antd/src。
      # ⚠️ 已知误报：`at-rule-prelude-no-invalid` 会把 Tailwind `@apply` 的 utility 序列
      # 当成选择器列表解析（实测 `.a { @apply ml-5; }` 也报错）。该规则来自
      # `@vben/stylelint-config`，修法是在其中加 `ignoreAtRules: ['apply', 'tailwind']`；
      # 在规则修好前，唯一命中点（role/modules/form.vue）用行内 stylelint-disable 豁免。
      - name: Stylelint（web-antd 全量）
        run: pnpm exec stylelint "apps/web-antd/src/**/*.{vue,css}" --config stylelint.config.mjs

      # 格式门禁：oxfmt 是仓内既定工具（`pnpm format` 已用它），但此前从未进 CI，
      # 于是有 9 个文件长期漂移。跑一次约 3 秒，成本极低。
      - name: 格式检查（oxfmt）
        run: pnpm exec oxfmt --check apps/web-antd/src

      - name: Typecheck（web-antd）
        run: pnpm -F @vben/web-antd run typecheck

      # 组件级/纯函数用例。此前本仓 CI **不跑任何 vitest**（根 `pnpm test:unit` 在
      # TZ=UTC 主机上有既存的时区断言失败，与业务无关），导致 `space-tree.test.ts` 等
      # 已写好的用例从不执行。这里按目录显式接入，避开那条既存失败。
      - name: 单元测试（views/system / utils / store）
        run: pnpm exec vitest run --dom apps/web-antd/src/views/system apps/web-antd/src/utils apps/web-antd/src/store

      # 🔴 i18n **文案编译**门禁：键存在 ≠ 值能编译。
      # vue-i18n 在**渲染期**编译消息，一个未转义的字面 `{` 会让 `$t()` 抛
      # `SyntaxError: Message compilation error` ⇒ 渲染函数异常 ⇒ **整块页面空白**，
      # 而 typecheck / 构建 / 键存在性校验**全绿**（键确实存在，只是编译不过）。
      # 本仓实测命中 1 条：`system.space.extJsonPlaceholder` 的 `{"fireZone":"A"}`（zh + en 各一处），
      # 修法是用 vue-i18n 的字面量插值语法 `{'{'}` / `{'}'}`。
      # 同一门禁在 fork `ypbin-iot-ui` 已有（2026-09-27 事故后加的），此处为回流。
      - name: i18n 文案编译校验（全库，zh-CN + en-US）
        run: node scripts/check-i18n-message-compile.mjs

      - name: 单元测试（埋点 SDK）
        # 该 SDK 有真实逻辑（批量、队列、URL 截断、令牌携带）且已有单测，
        # 但包内原本没有任何 scripts，`pnpm -F @vben/tracking test` 是空转（无输出却成功）；
        # 这里显式接入，避免「命令成功但其实没跑」的假绿。
        run: pnpm -F @vben/tracking test

      - name: 类型检查（埋点 SDK）
        # 与单测同理：该包此前既无 scripts、也无 typecheck 门禁，
        # 包内一处签名不兼容（测试假 router 的回调参数）一直没被 CI 发现。
        run: pnpm -F @vben/tracking run typecheck

      - name: 构建（web-antd）
        run: pnpm -F @vben/web-antd run build

  tracking-events-drift:
    name: 校验埋点事件码未漂移
    runs-on: ubuntu-latest
    steps:
      # 事件目录分两层：base 在 starter 仓、project 在宿主后端仓（admin）。前端生成物是**两者合并**的结果，
      # 故两仓都要检出——只检出 starter 会退化成「纯 base」生成物，与已提交的联合生成物不一致（门禁会如实报红）。
      # ⚠ 两仓的默认分支名并不同：starter 是 `master`、admin 是 `main`（starter 从未有 main）。
      # 这里显式写 `ref:` 而不是依赖默认分支：门禁的比对基准必须一眼可见——两仓各自的分支
      # 若还没合入「base 迁出 / 宿主目录」，本门禁必然失败，而此时失败性质是**检出/配置**而非事件码漂移，
      # 生成器会以退出码 2 明确区分（见 scripts/sync-tracking-events.mjs 头部说明）。
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 检出 starter（base 层事件目录事实源）
        uses: actions/checkout@v4
        with:
          repository: wenbin-wb/ypbin-starter
          ref: master
          path: ypbin-starter

      - name: 检出 admin（宿主 project 层事件目录）
        uses: actions/checkout@v4
        with:
          repository: wenbin-wb/ypbin-admin
          ref: main
          path: ypbin-admin

      - name: 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0

      - name: 校验前端事件码与 base + project 合并结果一致
        env:
          # 这两个路径必须与上方 checkout 的 `path:` 逐字一致（${{ github.workspace }} 即检出根目录）。
          # 生成器据 HOST_REPO_ROOT 递归定位宿主 project 层目录；显式给了却不含该目录时
          # 以退出码 2 报「配置/检出问题」，不会误报成事件码漂移。
          STARTER_REPO_ROOT: ${{ github.workspace }}/ypbin-starter
          HOST_REPO_ROOT: ${{ github.workspace }}/ypbin-admin
        run: node scripts/sync-tracking-events.mjs --check
